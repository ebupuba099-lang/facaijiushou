name: 神仙连开奖填入

on:
  schedule:
    - cron: '0 0 31 2 *'    # 已禁用: 腾讯云SCF已接管(21:00-22:50每10分钟兜底)，保留手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lottery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/lottery.py
        env:
          TZ: Asia/Shanghai
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
